<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="zy2755 — 把日常的麻烦，写成小工具">
  <defs>
    <linearGradient id="bg" x1="140" y1="-60" x2="1060" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0C16"/>
      <stop offset="0.55" stop-color="#12122A"/>
      <stop offset="1" stop-color="#0A0B12"/>
    </linearGradient>

    <linearGradient id="cardStroke" x1="60" y1="60" x2="1140" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.20"/>
    </linearGradient>

    <linearGradient id="topSheen" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="lens" cx="0.35" cy="0.3" r="0.75">
      <stop stop-color="#FFFFFF" stop-opacity="0.20"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.10"/>
    </radialGradient>

    <radialGradient id="lensCore" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#8B7BFF" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#FF7AB6" stop-opacity="0.10"/>
    </radialGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="72"/>
    </filter>

    <clipPath id="cardClip">
      <rect x="56" y="56" width="1088" height="228" rx="34"/>
    </clipPath>
    <clipPath id="lensClip">
      <circle cx="1000" cy="170" r="66"/>
    </clipPath>
  </defs>

  <!-- 底色 -->
  <rect width="1200" height="340" fill="url(#bg)"/>

  <!-- 液态光斑 -->
  <g filter="url(#soft)" opacity="0.85">
    <circle cx="180" cy="26" r="150" fill="#7C5CFF"/>
    <circle cx="1010" cy="330" r="165" fill="#22D3EE"/>
    <circle cx="640" cy="356" r="130" fill="#FF7AB6" opacity="0.55"/>
    <circle cx="880" cy="10" r="110" fill="#5B8CFF" opacity="0.5"/>
  </g>

  <!-- 玻璃卡片 -->
  <g>
    <rect x="56" y="56" width="1088" height="228" rx="34" fill="#FFFFFF" fill-opacity="0.055"/>
    <rect x="56" y="56" width="1088" height="228" rx="34" fill="none" stroke="url(#cardStroke)" stroke-width="1.4"/>
  </g>

  <!-- 顶部柔光 + 缓慢扫过的光 -->
  <g clip-path="url(#cardClip)" opacity="0.92">
    <rect x="56" y="56" width="1088" height="120" fill="url(#topSheen)"/>
    <rect x="-320" y="56" width="300" height="228" fill="url(#sheen)" transform="skewX(-14)">
      <animateTransform attributeName="transform" type="translate" values="-340 0; 1300 0; 1300 0" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- 玻璃透镜 -->
  <g>
    <circle cx="1000" cy="170" r="66" fill="url(#lensCore)" opacity="0.9"/>
    <circle cx="1000" cy="170" r="66" fill="url(#lens)"/>
    <circle cx="1000" cy="170" r="66" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1.2"/>
    <g clip-path="url(#lensClip)" opacity="0.5">
      <circle cx="1000" cy="170" r="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
      <circle cx="1000" cy="170" r="22" fill="none" stroke="#FFFFFF" stroke-opacity="0.30" stroke-width="1"/>
    </g>
    <path d="M 946 132 A 66 66 0 0 1 1004 106" fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="2.4" stroke-linecap="round"/>
  </g>

  <!-- 文字 -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'HarmonyOS Sans SC', 'Microsoft YaHei', sans-serif">
    <text x="112" y="150" font-size="60" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">zy2755</text>
    <text x="114" y="196" font-size="23" fill="#B9BCDA" letter-spacing="0.6">把日常的麻烦，写成小工具。</text>

    <!-- 标签 -->
    <g font-size="15" fill="#E7E8F5">
      <g>
        <rect x="112" y="212" width="86" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="155" y="233" text-anchor="middle">Android</text>
      </g>
      <g>
        <rect x="208" y="212" width="138" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="277" y="233" text-anchor="middle">Kotlin · Compose</text>
      </g>
      <g>
        <rect x="356" y="212" width="84" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="398" y="233" text-anchor="middle">Python</text>
      </g>
      <g>
        <rect x="450" y="212" width="104" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="502" y="233" text-anchor="middle">TypeScript</text>
      </g>
      <g>
        <rect x="564" y="212" width="116" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.14"/>
        <text x="622" y="233" text-anchor="middle">Liquid Glass</text>
      </g>
    </g>
  </g>
</svg>
